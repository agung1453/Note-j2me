name: Build J2ME Notes

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant and download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip maven
          mkdir -p lib
          wget -q https://repo.maven.apache.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -O lib/cldcapi.jar
          wget -q https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -O lib/midpapi.jar
          mvn -q -f tools/pom.xml dependency:copy-dependencies -DoutputDirectory="$GITHUB_WORKSPACE/lib/proguard"

      - name: Compile Java ME classes
        run: ant clean compile

      - name: Preverify for CLDC 1.1
        run: |
          mkdir -p build/preverified
          java -cp "lib/proguard/*" proguard.ProGuard \
            -injars build/classes \
            -outjars build/preverified.jar \
            -libraryjars lib/cldcapi.jar \
            -libraryjars lib/midpapi.jar \
            -dontshrink \
            -dontoptimize \
            -dontobfuscate \
            -microedition \
            -target 1.1
          unzip -q build/preverified.jar -d build/preverified
          test -f build/preverified/com/example/notes/NotesMIDlet.class

      - name: Package JAR and JAD
        run: |
          mkdir -p dist
          cat > build/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          MIDlet-Name: Notes
          MIDlet-Version: 1.0.1
          MIDlet-Vendor: Personal
          MIDlet-1: Notes,,com.example.notes.NotesMIDlet
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1

          EOF
          jar cfm dist/Notes.jar build/MANIFEST.MF -C build/preverified .
          JAR_SIZE=$(stat -c%s dist/Notes.jar)
          cat > dist/Notes.jad <<EOF
          MIDlet-Name: Notes
          MIDlet-Version: 1.0.1
          MIDlet-Vendor: Personal
          MIDlet-1: Notes,,com.example.notes.NotesMIDlet
          MIDlet-Jar-URL: Notes.jar
          MIDlet-Jar-Size: ${JAR_SIZE}
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1
          EOF
          jar tf dist/Notes.jar | grep -q 'com/example/notes/NotesMIDlet.class'
          unzip -p dist/Notes.jar com/example/notes/NotesMIDlet.class | od -An -t u1 -N 8

      - name: Upload JAR and JAD
        uses: actions/upload-artifact@v4
        with:
          name: j2me-notes-nokia-c2-00-preverified
          path: |
            dist/Notes.jar
            dist/Notes.jad
          if-no-files-found: error
          retention-days: 30
