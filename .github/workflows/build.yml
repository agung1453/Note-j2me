name: Build J2ME Notes

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip

      - name: Download Java ME API stubs
        run: |
          mkdir -p lib
          wget -q https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -O lib/cldcapi.jar
          wget -q https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -O lib/midpapi.jar

      - name: Build JAR and JAD
        run: ant clean jar

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: j2me-notes-nokia-c2-00
          path: |
            dist/Notes.jar
            dist/Notes.jad
          if-no-files-found: error
          retention-days: 30
